name: Update profile art

# Refreshes the contribution heatmap SVG from real data.
# Runs daily, on push to main, and on demand. The hero + wordmark are static
# (regenerate them locally only if you change the text/colors).

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py Hamna12
      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py
      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
